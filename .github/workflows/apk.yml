name: APK

# Compila el APK de release en cada push a main o a la rama del editor y lo
# deja en la release "prueba", con un enlace que no cambia para bajarlo
# desde el telefono:
# https://github.com/royerplus/royer-method/releases/download/prueba/RoyerMethod.apk
#
# Junto a el va la variante github (com.royermethod.app.github, "Royer Method
# · GitHub"), que es la que se instala en el telefono: tiene su propio id y
# no reemplaza ni la app normal ni la .prueba del PC.
# https://github.com/royerplus/royer-method/releases/download/prueba/RoyerMethodGitHub.apk

on:
  push:
    branches: [main, claude/project-thread-skalim]
  workflow_dispatch:

# Una sola a la vez: todas publican en la misma release.
concurrency:
  group: apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # El release se firma con una clave que se guarda en la cache y se reusa:
      # con una nueva en cada compilacion el telefono no deja instalar encima
      # sin desinstalar. No va en el repo porque el repo es publico. Ojo:
      # GitHub borra una cache que no se usa en 7 dias.
      - name: Clave de firma
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: firma-pruebas-v1

      - name: Crear la clave si no estaba
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Dependencias nativas
        run: bash tools/traer_dependencias.sh

      # FIRMA_CI le dice a app/build.gradle.kts que firme con la clave de la
      # cache. Hasta el 2026-10-19 no se le decia y el plugin de Android se
      # hacia una clave propia en cada compilacion.
      - name: Compilar
        run: FIRMA_CI="$HOME/.android/debug.keystore" bash ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" assembleRelease assembleGithub

      # Si un APK no sale con la clave de la cache, no se publica. La huella
      # se lee del propio APK con tools/huella_firma.py: con apksigner salia
      # vacia.
      - name: Comprobar firma
        run: |
          esperada=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/github/app-github.apk; do
            tiene=$(python3 tools/huella_firma.py "$apk")
            echo "$apk firmado con $tiene (clave de la cache: $esperada)"
            [ -n "$esperada" ] && [ "$tiene" = "$esperada" ] || { echo "El APK no lleva la clave de la cache"; exit 1; }
          done

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RoyerMethod.apk
          cp app/build/outputs/apk/github/app-github.apk RoyerMethodGitHub.apk
          gh release delete prueba --yes --cleanup-tag || true
          gh release create prueba RoyerMethodGitHub.apk RoyerMethod.apk --prerelease --target "$GITHUB_SHA" \
            --title "Prueba del editor" \
            --notes "Compilado de $GITHUB_REF_NAME en ${GITHUB_SHA::7}."
