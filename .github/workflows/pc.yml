name: PC

# Compila la version para Windows (carpeta pc/) en cada push a main o a la
# rama del editor y la deja en la release "pc", con enlaces que no cambian:
# https://github.com/royerplus/royer-method/releases/download/pc/RoyerMethodPC.msi
# https://github.com/royerplus/royer-method/releases/download/pc/RoyerMethodPC.zip
# La release es otra que la del APK ("prueba"), que se borra y rehace en cada
# compilacion del telefono.

on:
  push:
    branches: [main, claude/project-thread-skalim]
    paths: ["pc/**", "app/src/main/java/**", ".github/workflows/pc.yml"]
  workflow_dispatch:

concurrency:
  group: pc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar e instalador
        shell: bash
        run: ./gradlew -p pc --no-daemon packageMsi createDistributable

      - name: Prueba del motor (sin ventana)
        shell: bash
        run: |
          ffmpeg -version >/dev/null 2>&1 || choco install ffmpeg -y --no-progress >/dev/null
          mkdir -p prueba
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest prueba/a.mp4
          ./gradlew -p pc --no-daemon -q cp
          java -cp "$(cat pc/build/cp.txt)" com.royermethod.pc.Prueba prueba/sal prueba/a.mp4 || echo "::warning::La prueba del motor fallo (el runner no tiene GPU)"

      - name: Publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pc/build/compose/binaries/main/msi/*.msi RoyerMethodPC.msi
          (cd pc/build/compose/binaries/main/app && 7z a -tzip ../../../../../../RoyerMethodPC.zip "Royer Method" >/dev/null)
          gh release delete pc --yes --cleanup-tag || true
          gh release create pc RoyerMethodPC.msi RoyerMethodPC.zip --prerelease --target "$GITHUB_SHA" \
            --title "Royer Method para PC (prueba)" \
            --notes "Version para Windows, compilada de $GITHUB_SHA. El .msi la instala; el .zip se descomprime y se abre Royer Method.exe."
